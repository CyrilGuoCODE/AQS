<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t_title }} - 家长会预约系统</title>
    {% include '_theme_head.html' %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/theme.js') }}" defer></script>
</head>
<body>
    {% include '_icons.html' %}
    <div class="page">
        <header class="topbar">
            <div class="topbar-title">
                <span class="topbar-grade">{{ t_grade }}</span>
                <h1>{{ t_title }}</h1>
            </div>
            <div class="topbar-actions">
                <button class="icon-btn" data-theme-toggle type="button" aria-label="切换主题" title="切换主题">
                    <svg class="icon icon-moon" aria-hidden="true"><use href="#i-moon"></use></svg>
                    <svg class="icon icon-sun" aria-hidden="true"><use href="#i-sun"></use></svg>
                </button>
                <a href="/parent" class="btn btn-ghost" aria-label="返回">
                    <svg class="icon" aria-hidden="true"><use href="#i-arrow-left"></use></svg><span class="btn-label">返回</span>
                </a>
                <a href="/logout" class="btn btn-ghost" aria-label="登出">
                    <svg class="icon" aria-hidden="true"><use href="#i-log-out"></use></svg><span class="btn-label">登出</span>
                </a>
            </div>
        </header>

        <main class="card content notice-page">
            <svg class="icon" aria-hidden="true"><use href="#i-calendar"></use></svg>
            <p class="muted" style="margin-top: 10px;">预约开放时间</p>
            <p class="notice-time">{{ t_start_time }}</p>
            <p class="muted">预约截止时间</p>
            <p class="notice-time">{{ t_end_time }}</p>
            <div class="page-actions">
                <a href="/parent" class="btn btn-primary">返回</a>
            </div>
        </main>
    </div>
    <script src="{{ url_for('static', filename='js/ui.js') }}"></script>
    {% include '_footer.html' %}
</body>
</html>
